# 量化策略配置（新闻情绪驱动）
# 注意：仅用于学习研究，不构成投资建议。

data:
  start_date: "20240101"     # 历史数据起始日 YYYYMMDD
  end_date: "20260821"       # 历史数据截止日 YYYYMMDD

symbols:
  - code: "600519"           # akshare 用代码（A股为6位代码）
    symbol: "600519"         # vnpy 用 symbol
    exchange: "SSE"          # vnpy Exchange 枚举值
    market: "cn"
    name: "贵州茅台"
    fixed_size: 100          # 每次开仓股数
    lot_size: 100  # min trading unit (CN=100, US=1)

  - code: "000858"
    symbol: "000858"
    exchange: "SZSE"
    market: "cn"
    name: "五粮液"
    fixed_size: 100
    lot_size: 100  # min trading unit (CN=100, US=1)

  - code: "105.AAPL"         # 美股使用东财 secid（105=纳斯达克）
    symbol: "AAPL"
    exchange: "NASDAQ"
    market: "us"
    name: "苹果"
    fixed_size: 100
    lot_size: 1  # min trading unit (CN=100, US=1)

  - code: "105.MSFT"
    symbol: "MSFT"
    exchange: "NASDAQ"
    market: "us"
    name: "微软"
    fixed_size: 100
    lot_size: 1  # min trading unit (CN=100, US=1)

sentiment:
  threshold_long: 0.3        # 情绪分 >= 该值则开多
  threshold_flat: -0.3       # 情绪分 <= 该值则平多（只做多头，默认空仓）
  backend: lexicon           # 情绪打分后端：lexicon | finbert | llm
  finbert_model: "yiyanghkust/finbert-tone"   # finbert 后端用（如 baptle/FinBERT_market_based）
  finbert_device: ""         # 可选：cpu / cuda / 0（空=自动）
  llm_api_base: ""           # llm 后端用（OpenAI 兼容，留空读 OPENAI_BASE_URL）
  llm_api_key: ""            # 留空读 OPENAI_API_KEY
  llm_model: ""              # 留空读 OPENAI_MODEL，默认 gpt-4o-mini
  allow_short: false          # allow short selling (off for A-share)
  stop_loss_pct: 0.05         # initial stop loss (0=off)
  take_profit_pct: 0.0        # take profit (0=off)
  trailing_stop_pct: 0.0      # trailing stop (0=off)
  risk_percent: 0.0           # risk per trade as % of capital (>0 overrides fixed_size)
  max_position_pct: 0.95    # max position as % of capital

summary:
  enabled: true            # 是否用 LLM 生成日报综述（失败自动回退纯数据日报）
  top_n: 100               # 取影响分最高的 N 条新闻喂给 LLM
  api_base: ""             # 留空读 OPENAI_BASE_URL
  api_key: ""              # 留空读 OPENAI_API_KEY
  model: ""                # 留空读 OPENAI_MODEL，默认 gpt-4o-mini

backtest:
  start_date: "20240101"
  end_date: "20260821"
  capital: 1000000           # 初始资金
  rate: 0.0003               # 佣金费率（按成交额）
  slippage: 0.01             # 滑点（每股/每份）
  pricetick: 0.01            # 最小价格变动
  use_synthetic_sentiment: false   # 回测用合成情绪序列(演示策略机制)；false 用真实新闻情绪


news:
  # 启用的快讯源（留空则全部启用）
  enabled_sources: []  # 留空=全部启用
  # 日报专用企业微信机器人 webhook：留空则读取环境变量 WECOM_WEBHOOK_DAILY（再兜底 WECOM_WEBHOOK）
  # 与 monitor.wecom_webhook（告警机器人）分开，避免告警高频触发群机器人限流殃及日报。
  wecom_webhook: ""
monitor:
  poll_interval: 15              # 轮询秒数（10-60）
  enabled_sources: []            # 留空则用 news.enabled_sources
  themes_path: "news_aggregator/themes.yaml"
  top_constituents: 5            # 告警里展示每个板块前几只成分股
  board_cache_refresh_hours: 24  # 板块成分股缓存刷新周期
  impact_min: 0.45              # 影响分告警阈值（只推高影响，避免刷屏/触发Server酱限流）
                                # 校准后上调：0.3 时命中面过宽（实测一轮 381 条中 367 条触发）
  # 个股影响映射（LLM 判断新闻利好/利空哪些股票，告警里附加；有延迟/成本，默认关）
  stock_impact:
    enabled: true               # true=命中主题时调 LLM 做个股映射
    max_stocks: 6               # 每条新闻最多输出几只受影响股票
  # 推送开关（密钥留空则读取对应环境变量，见 push.py）
  push:
    wecom: true
    serverchan: false        # sendkey 失效（2026-08-24 实测 400 AUTH），改用企业微信
    telegram: false
    ntfy: false
  wecom_webhook: ""              # 企业微信【告警】机器人，留空读 WECOM_WEBHOOK（与日报机器人分开）
  serverchan_sendkey: ""         # Server酱，留空读 SERVERCHAN_SENDKEY
  telegram_token: ""             # 留空读 TELEGRAM_TOKEN
  telegram_chat_id: ""           # 留空读 TELEGRAM_CHAT_ID
  ntfy_topic: ""                 # 留空读 NTFY_TOPIC

# 一手源可选密钥（留空读环境变量）
primary:
  ap_api_key: ""          # AP_API_KEY
  congress_api_key: ""    # CONGRESS_API_KEY
  quiver_token: ""        # QUIVER_TOKEN（Quiver 另类数据需要）
  bargo_base_url: ""      # BARGO_BASE_URL（留空则跳过 Bargo）
  bargo_api_key: ""       # BARGO_API_KEY
  fred_api_key: ""        # FRED_API_KEY（美联储经济数据，可选）
  finnhub_api_key: ""     # FINNHUB_API_KEY（美股近期新闻回填，免费 tier 约2周，可选）

# 国会交易关注名单（留空=全部；命中才告警）
politicians:
  - Nancy Pelosi

# 反转因子策略（短期超跌买入，已通过随机对照与样本外检验，见 results/reversal_report.md）
# 用法：.venv/Scripts/python.exe scripts/paper_trade.py --reversal
reversal:
  threshold: -0.02        # T-1 日收盘跌幅 <= 该值触发买入（-0.02 = 跌超 2%）
  hold_days: 3            # 买入后第 N 个交易日收盘卖出（N=1 即次日收盘卖，满足 A股 T+1）
  max_position_pct: 0.95  # 每账户仓位上限（占该账户资金）
  rate: 0.0003            # 佣金率（双边）
  slippage: 0.01          # 滑点（元/股）
  universe: "data/universe_expanded.yaml"   # 标的池（42 只，每标的独立 100 万账户）

# 影响分模型（news_aggregator/impact.py）：综合来源权威度/爆发系数/情绪强度/持仓相关性/主题热度
# 权重经 2026-08-24 影响分校准（results/impact_calibration.md，36939 条新闻）：
# burst（多源爆发）对次日波动无预测力（burst=1 样本次日反而平静），权重下调；
# 有具体标的的新闻（公告/个股新闻）次日波动显著更大，relevance 权重上调。
impact:
  window_minutes: 60          # 突发检测时间窗（分钟）
  burst_cap: 4                # 相似条数达到该值即 burst=1
  themes_path: "news_aggregator/themes.yaml"
  weights:
    authority: 0.20           # 来源权威度
    burst: 0.05               # 爆发系数（校准显示无预测力，保留小权重）
    intensity: 0.25           # 情绪强度 |score|
    relevance: 0.30           # 持仓/关注相关度（有标的的新闻波动显著更大）
    theme: 0.20               # 主题热度



