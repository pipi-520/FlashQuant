name: news-aggregator

on:
  schedule:
    # 工作日 18:30 北京时间 = 10:30 UTC
    - cron: "30 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install akshare pandas requests pyyaml

      - name: Run aggregator
        run: python news_aggregator/run.py --push
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          QUIVER_TOKEN: ${{ secrets.QUIVER_TOKEN }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}

      - name: Commit news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update news aggregation $(date +%F)"
            git push
          fi


